<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Label Print</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            /*overflow: hidden;*/
            color: #fff;
            font-family: Arial, sans-serif;
            background-color: #000;
            background: radial-gradient(84.9% 52.16% at 31.56% 3.43%, #004468 0%, #000 100%);
            /*cursor: none;*/
        }

        header {
            padding: 16px;
            display: flex;
            flex-direction: row;
            align-items: center;
            margin-bottom: 16px;
        }

        h2 {
            margin-left: 16px;
        }

        header > * {
            padding: 0;
            margin: 0;
        }

        header > img {
            padding-right: 16px;
        }

        .buttons {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            margin-bottom: 44px;
        }

        button {
            font-size: 28px;
            border: 1px solid #004468;
            background-color: #3298ce;
            border-radius: 4px;
            padding: 24px 24px;
            margin: 16px;
        }

        #attendees {
            margin: 16px;
        }

        .attendee {
            margin-bottom: 4px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" width="96" id="landing"/>
        <h1>Scan fob to sign in to meeting</h1>
    </header>
    <h2>Ballots printed: <span id="ballotsGiven">0</span></h2>

    <button onclick="printBallot(this)">
        Print proxy ballot
    </button>

    <h2>Attendees</h2>
    <div id="attendees">
        <!-- populated by javascript -->
    </div>

    <script type="text/javascript">
        let ballotsGiven = [];

        function saveState() {
            localStorage.setItem("ballotsGiven", JSON.stringify(ballotsGiven));
            localStorage.setItem("attendees", document.getElementById("attendees").innerHTML);
        }

        function restoreState() {
            const ballotsGivenStr = localStorage.getItem("ballotsGiven");
            if (ballotsGivenStr) {
                ballotsGiven = JSON.parse(ballotsGivenStr);
                document.getElementById("ballotsGiven").innerHTML = ballotsGiven.length.toString();
            }
            const attendeesStr = localStorage.getItem("attendees");
            if (attendeesStr) {
                document.getElementById("attendees").innerHTML = attendeesStr;
            }
        }
        restoreState();

        let fob = '';
        document.onkeyup = function (ev) {
            ev.stopPropagation();
            ev.preventDefault();
            if (ev.key === 'Enter') {
                // submit fob
                const url = `/check?fob=${Number(fob)}`; // strip leading zeros
                fob = '';

                doReq(url);
            } else {
                // Read fob (if valid number)
                const n = Number(ev.key);
                if (Number.isFinite(n) && n >= 0 && n <= 9) {
                    fob += ev.key;
                }
            }
        };

        async function doReq(url) {
            console.log("Request: ", url);
            const res = await fetch(url, {method: "POST"});
            const text = await res.text();
            console.log(`Response (${res.status}): ${text}`);
            const target = document.getElementById("attendees");
            let validAttendee = res.status === 200;
            if (res.status === 404 || res.status === 200) {
                const hasBallot = ballotsGiven.includes(url);
                target.innerHTML += `<div class="attendee">${validAttendee ? (hasBallot ? '⚠️ [Duplicate]' : '✅') : '❌'} ${escapeHTML(text)}</div>`;
                if (validAttendee && !hasBallot) {
                    ballotsGiven.push(url);
                    printBallot(null);
                }
            } else {
                target.innerHTML += `<div class="attendee">⚠️ ${escapeHTML(text || `Unknown Member (${url})`)}</div>`;
            }
            saveState();
        }

        function escapeHTML(str) {
            const p = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            };
            return str.replace(/[&<>"']/g, s => p[s]);
        }

        async function printBallot(btn) {
            if (btn) {
                btn.blur();
                ballotsGiven.push("proxy");
            }
            document.getElementById("ballotsGiven").innerHTML = ballotsGiven.length.toString();
            saveState();

            const url = '/print?ballot=true';
            console.log("Request: ", url);
            const res = await fetch(url, {method: "POST"});
            const text = await res.text();
            console.log(`Response (${res.status}): ${text}`);
        }
    </script>
</body>
</html>
